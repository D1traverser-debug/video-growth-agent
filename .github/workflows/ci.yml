name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Install package and tests
        run: pip install -e . pytest==9.1.1
      - name: Run system hygiene audit
        run: vga system-audit --repo-root .
      - name: Run standalone Video Studio system audit
        run: |
          vga-studio system-audit --repo-root . > /tmp/standalone-video-studio-system-audit.json || true
          python - <<'PY'
          import json
          report = json.load(open('/tmp/standalone-video-studio-system-audit.json', encoding='utf-8'))
          if report['pass'] is not True:
              print(json.dumps(report, indent=2, ensure_ascii=False))
              raise SystemExit('standalone Video Studio system audit failed')
          assert report['structural_status'] == 'PASS', report
          assert report['production_readiness'] == 'PARTIAL', report
          assert report['boundary']['caos_runtime_dependency'] is False, report
          assert report['boundary']['paid_provider_calls_made'] is False, report
          assert report['capability_gaps'], report
          print('standalone-video-studio-system-audit: PASS')
          PY
      - name: Run tests
        run: pytest -q
      - name: Smoke test standalone outcome-driven Video Studio
        run: |
          vga-studio --help > /tmp/vga-studio-help.txt
          test -s /tmp/vga-studio-help.txt
          studio_root="$(mktemp -d)"
          vga-studio --root "$studio_root" init smoke-episode --title "Standalone Studio smoke" --brief examples/technology-explainer.brief.json > /tmp/studio-init.json
          vga-studio --root "$studio_root" plan smoke-episode examples/technology-explainer.tasks.json > /tmp/studio-plan.json
          vga-studio --root "$studio_root" status smoke-episode > /tmp/studio-status.json
          vga-studio --root "$studio_root" audit smoke-episode > /tmp/studio-audit.json
          python - <<'PY'
          import json
          status = json.load(open('/tmp/studio-status.json', encoding='utf-8'))
          audit = json.load(open('/tmp/studio-audit.json', encoding='utf-8'))
          assert set(status['ready_tasks']) == {'research', 'creative-directions'}, status
          assert audit['pass'] is True, audit
          assert audit['task_count'] == 13, audit
          print('standalone-video-studio-smoke: PASS')
          PY
      - name: Smoke test integrated Program context and parallel readiness
        run: |
          program_root="$(mktemp -d)"
          vga-studio --root "$program_root" init ai-self-media-commercialization --title "Integrated Program smoke" --brief examples/ai-self-media-commercialization.brief.json > /tmp/program-init.json
          vga-studio --root "$program_root" import-manifest ai-self-media-commercialization examples/ai-self-media-commercialization.context.json > /tmp/program-context-import.json
          vga-studio --root "$program_root" plan ai-self-media-commercialization examples/ai-self-media-commercialization.tasks.json > /tmp/program-plan.json
          vga-studio --root "$program_root" status ai-self-media-commercialization > /tmp/program-status.json
          vga-studio --root "$program_root" tasks ai-self-media-commercialization > /tmp/program-tasks.json
          vga-studio --root "$program_root" audit ai-self-media-commercialization > /tmp/program-audit.json
          python - <<'PY'
          import json
          status = json.load(open('/tmp/program-status.json', encoding='utf-8'))
          tasks = json.load(open('/tmp/program-tasks.json', encoding='utf-8'))
          audit = json.load(open('/tmp/program-audit.json', encoding='utf-8'))
          task_map = {item['task_id']: item for item in tasks}
          assert len(tasks) == 50, len(tasks)
          assert task_map['growth-baseline-and-topic-hypotheses']['status'] == 'READY', task_map['growth-baseline-and-topic-hypotheses']
          assert task_map['commercial-advertiser-map']['status'] == 'READY', task_map['commercial-advertiser-map']
          assert task_map['production-economics-baseline']['status'] == 'READY', task_map['production-economics-baseline']
          assert task_map['provider-capability-benchmark']['status'] == 'READY', task_map['provider-capability-benchmark']
          assert task_map['jensen-case-fact-audit']['status'] == 'READY', task_map['jensen-case-fact-audit']
          assert task_map['jensen-source-media-inspection']['status'] == 'WAITING_INPUT', task_map['jensen-source-media-inspection']
          assert task_map['jensen-rights-identity-audit']['status'] == 'WAITING_INPUT', task_map['jensen-rights-identity-audit']
          assert task_map['ipos-video-identity-bundle-import']['status'] == 'PENDING', task_map['ipos-video-identity-bundle-import']
          assert status['task_counts']['READY'] >= 6, status
          assert audit['pass'] is True, audit
          print('standalone-program-context-smoke: PASS')
          PY
      - name: Smoke test installed CLI outside repository
        run: |
          cd /tmp
          vga-studio --help > /tmp/vga-studio-outside-repo.txt
          python -m video_studio --help > /tmp/video-studio-module-help.txt
          studio_root="$(mktemp -d)"
          vga-studio --root "$studio_root" init outside-repo-smoke --title "Installed standalone smoke" --brief "$GITHUB_WORKSPACE/examples/technology-explainer.brief.json" > /tmp/standalone-init.json
          vga-studio --root "$studio_root" plan outside-repo-smoke "$GITHUB_WORKSPACE/examples/technology-explainer.tasks.json" > /tmp/standalone-plan.json
          vga-studio --root "$studio_root" audit outside-repo-smoke > /tmp/standalone-audit.json
          python - <<'PY'
          import json
          import sys
          from video_studio.engine import StudioEngine
          import video_studio
          assert "video_growth_agent" not in sys.modules
          from video_growth_agent.studio_engine import StudioEngine as LegacyEngine
          assert LegacyEngine is StudioEngine
          report = json.load(open('/tmp/standalone-audit.json', encoding='utf-8'))
          assert report['pass'] is True, report
          assert report['task_count'] == 13, report
          print('standalone-video-studio-outside-repo: PASS')
          PY
          vga system-audit > /tmp/system-audit.json
          python - <<'PY'
          import json
          report = json.load(open('/tmp/system-audit.json', encoding='utf-8'))
          assert report['pass'] is True, report
          PY
          vga techniques --tag mechanism --max-cost 2 > /tmp/techniques.json
          test -s /tmp/techniques.json
          python - <<'PY'
          import json
          from importlib.metadata import version
          from video_growth_agent import (
              AgentRegistry,
              AgenticStudio,
              ExecutionPlanner,
              GeminiReviewerAdapter,
              OpenRouterVisionReviewerAdapter,
              RoleRegistry,
              StudioOrchestrator,
              TechniqueLibrary,
          )
          from video_growth_agent.storage import ProjectStore

          def semver(value):
              return tuple(int(part) for part in value.split('.'))

          package_version = version("video-growth-agent")
          registry = RoleRegistry()
          orchestrator = StudioOrchestrator()
          agents = AgentRegistry()
          planner = ExecutionPlanner(agents=agents, orchestrator=orchestrator)
          assert package_version
          assert registry.get("showrunner").prompt
          assert registry.get("creative_director").prompt
          assert orchestrator.workflow["version"]
          assert agents.config["version"] == planner.config["version"]
          assert semver(agents.config["version"]) <= semver(package_version)
          assert agents.config["principles"]["tool_labels_are_capability_requests_not_execution_proof"] is True
          assert planner.validate() == []
          assert agents.get("executive_producer").user_voice is True
          assert agents.get("visual_designer").role is None
          assert agents.get("growth_strategist").kind == "supervisor"
          assert agents.get("production_methodologist").kind == "worker"
          assert agents.get("evolution_engineer").kind == "worker"
          learn_agents = [task.get("agent") for task in planner.config["stages"]["LEARN"]["tasks"]]
          assert learn_agents == ["production_methodologist", "evolution_engineer", "red_team", "showrunner"]
          assert planner.config["stages"]["TECH_QA"]["tasks"][0]["outputs"] == ["technical_qa"]
          assert planner.config["stages"]["RELEASE"]["external_inputs"] == ["final_media", "publish_pack"]
          assert "LOOKDEV" in orchestrator.index
          assert "creative_director" in orchestrator.required_roles("VISUAL_PREVIEW")
          library = TechniqueLibrary()
          assert library.get("T-001").name
          assert all(item.status == "validated" for item in library.find({"mechanism", "hook", "scale", "data", "metaphor"}))
          assert str(ProjectStore().root) == "/tmp/projects"
          assert GeminiReviewerAdapter().model
          assert OpenRouterVisionReviewerAdapter().model
          AgenticStudio()
          print("installed-agentic-studio-smoke: PASS")
          PY
