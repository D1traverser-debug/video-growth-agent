name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install package and tests
        run: pip install -e . pytest
      - name: Run tests
        run: pytest -q
      - name: Smoke test CLI and technique routing
        run: |
          vga techniques --tag mechanism --max-cost 2 --validated-only > /tmp/techniques.json
          test -s /tmp/techniques.json
