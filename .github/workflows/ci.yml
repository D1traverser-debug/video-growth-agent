name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install package and tests
        run: pip install -e . pytest
      - name: Run tests
        run: pytest -q
      - name: Smoke test installed CLI outside repository
        run: |
          cd /tmp
          vga techniques --tag mechanism --max-cost 2 --validated-only > /tmp/techniques.json
          test -s /tmp/techniques.json
          python - <<'PY'
          from video_growth_agent import RoleRegistry, StudioOrchestrator, TechniqueLibrary
          from video_growth_agent.storage import ProjectStore
          assert RoleRegistry().get("showrunner").prompt
          assert StudioOrchestrator().workflow["version"] == "0.2.0"
          assert TechniqueLibrary().get("T-001").name
          assert str(ProjectStore().root) == "/tmp/projects"
          print("installed-runtime-smoke: PASS")
          PY
