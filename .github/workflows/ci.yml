name: ci
on:
  push:
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  prompt-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install lightweight contract test tools
        run: pip install -e . pytest==9.1.1
      - name: Prompt director source and rendering contract tests
        run: pytest -q tests/test_prompt_director.py tests/test_prompt_experiment.py tests/test_source_director.py tests/test_craft_round.py
      - name: CLI direct-prompts smoke
        run: |
          vga direct-prompts tests/fixtures/prompt_ribbon_10s.json --route compare --h3-style chinese > /tmp/h3-cn.json
          vga direct-prompts tests/fixtures/prompt_ribbon_10s.json --route onepass --h3-style official > /tmp/h3-official.json
          vga direct-prompts tests/fixtures/prompt_ribbon_10s.json --study-h3-dialects > /tmp/h3-experiment.json
          vga author-director tests/fixtures/ribbon_original_30s.txt --seconds 10 --source-ref user-quoted://full-30-second-ribbon-storyboard-2026-10-23 > /tmp/raw-authoring.json
          vga craft-round tests/fixtures/prompt_ribbon_fullsource_10s.json > /tmp/craft-round.json
          python - <<'PY'
          import json
          chinese = json.load(open('/tmp/h3-cn.json', encoding='utf-8'))
          official = json.load(open('/tmp/h3-official.json', encoding='utf-8'))
          assert chinese['routes']['onepass']['status'] == 'COMPILED'
          assert '逐时段分镜' in chinese['routes']['onepass']['prompts'][0]['prompt']
          assert official['routes']['onepass']['status'] == 'COMPILED'
          assert official['routes']['onepass']['prompts'][0]['prompt'].startswith('integrated_multimodal_description:')
          assert chinese['visual_winner'] is None
          authoring = json.load(open('/tmp/raw-authoring.json', encoding='utf-8'))
          assert authoring['status'] == 'AUTHORING_PACKET_READY'
          assert authoring['packet']['source_inventory']['source_timing_unit_count'] == 24
          craft = json.load(open('/tmp/craft-round.json', encoding='utf-8'))['packet']
          assert len(craft['orders']) == 7
          assert craft['execution_status'] == 'PREPARED_NOT_REVIEWED'
          experiment = json.load(open('/tmp/h3-experiment.json', encoding='utf-8'))
          assert experiment['quality_winner'] is None
          assert experiment['experiment_plan']['attribution_mode'] == 'BUNDLED_PROMPT_POLICY_NOT_LANGUAGE_CAUSAL'
          PY
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Ensure FFmpeg is available
        run: |
          if command -v ffmpeg >/dev/null 2>&1 && command -v ffprobe >/dev/null 2>&1; then
            ffmpeg -version | head -n 1
          else
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
      - name: Install package and tests
        run: pip install -e . pytest==9.1.1
      - name: Run system hygiene audit
        run: vga system-audit --repo-root .
      - name: Run tests
        run: pytest -q
      - name: Smoke test installed CLI outside repository
        run: |
          cd /tmp
          vga system-audit > /tmp/system-audit.json
          python - <<'PY'
          import json
          report = json.load(open('/tmp/system-audit.json', encoding='utf-8'))
          assert report['pass'] is True, report
          PY
          vga techniques --tag mechanism --max-cost 2 > /tmp/techniques.json
          test -s /tmp/techniques.json
          python - <<'PY'
          import json
          from importlib.metadata import version
          from video_growth_agent import (
              AgentRegistry,
              AgenticStudio,
              ExecutionPlanner,
              GeminiReviewerAdapter,
              OpenRouterVisionReviewerAdapter,
              RoleRegistry,
              StudioOrchestrator,
              TechniqueLibrary,
          )
          from video_growth_agent.storage import ProjectStore

          def semver(value):
              return tuple(int(part) for part in value.split('.'))

          package_version = version("video-growth-agent")
          registry = RoleRegistry()
          orchestrator = StudioOrchestrator()
          agents = AgentRegistry()
          planner = ExecutionPlanner(agents=agents, orchestrator=orchestrator)
          assert package_version
          assert registry.get("showrunner").prompt
          assert registry.get("creative_director").prompt
          assert orchestrator.workflow["version"]
          assert agents.config["version"] == planner.config["version"]
          assert semver(agents.config["version"]) <= semver(package_version)
          assert agents.config["principles"]["tool_labels_are_capability_requests_not_execution_proof"] is True
          assert planner.validate() == []
          assert agents.get("executive_producer").user_voice is True
          assert agents.get("visual_designer").role is None
          assert agents.get("growth_strategist").kind == "supervisor"
          assert agents.get("production_methodologist").kind == "worker"
          assert agents.get("evolution_engineer").kind == "worker"
          learn_agents = [task.get("agent") for task in planner.config["stages"]["LEARN"]["tasks"]]
          assert learn_agents == ["production_methodologist", "evolution_engineer", "red_team", "showrunner"]
          assert planner.config["stages"]["TECH_QA"]["tasks"][0]["outputs"] == ["technical_qa"]
          assert planner.config["stages"]["RELEASE"]["external_inputs"] == ["final_media", "publish_pack"]
          assert "LOOKDEV" in orchestrator.index
          assert "creative_director" in orchestrator.required_roles("VISUAL_PREVIEW")
          library = TechniqueLibrary()
          assert library.get("T-001").name
          assert all(item.status == "validated" for item in library.find({"mechanism", "hook", "scale", "data", "metaphor"}))
          assert str(ProjectStore().root) == "/tmp/projects"
          assert GeminiReviewerAdapter().model
          assert OpenRouterVisionReviewerAdapter().model
          AgenticStudio()
          print("installed-agentic-studio-smoke: PASS")
          PY
