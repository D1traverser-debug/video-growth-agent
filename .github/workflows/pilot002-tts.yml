name: pilot002-kokoro-tts
on:
  push:
    branches: [tts-pilot002-kokoro]
    paths:
      - tools/pilot002_tts.py
      - .github/workflows/pilot002-tts.yml
permissions:
  contents: read
jobs:
  synthesize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU TTS stack
        run: |
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install --disable-pip-version-check 'git+https://github.com/hexgrad/kokoro.git' 'misaki[zh]' soundfile
      - name: Synthesize scene-wise Chinese voice candidates
        run: python tools/pilot002_tts.py
      - uses: actions/upload-artifact@v4
        with:
          name: pilot002-kokoro-tts
          path: tts-output/
          if-no-files-found: error
          retention-days: 7
