name: pilot002-kokoro-tts
on:
  push:
    branches: [tts-pilot002-kokoro]
    paths:
      - tools/pilot002_tts.py
      - .github/workflows/pilot002-tts.yml
permissions:
  contents: read
jobs:
  synthesize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install TTS stack
        run: pip install --disable-pip-version-check 'kokoro==0.7.12' 'misaki[zh]==0.7.12' soundfile
      - name: Synthesize two Chinese voice candidates
        run: python tools/pilot002_tts.py
      - name: Probe outputs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          for f in tts-output/*.wav; do ffprobe -v error -show_entries format=filename,duration,size -of json "$f"; done
      - uses: actions/upload-artifact@v4
        with:
          name: pilot002-kokoro-tts
          path: tts-output/*.wav
          if-no-files-found: error
          retention-days: 7
