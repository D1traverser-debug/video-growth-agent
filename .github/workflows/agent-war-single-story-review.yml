name: Agent War V4 - One Blind Story Editor
on:
  push:
    branches:
      - refactor/prompt-director-core-20261023
    paths:
      - audits/agent_war_single_reviews/REQUEST.json
  workflow_dispatch:

concurrency:
  group: agent-war-v4-blind-${{ github.ref }}
  cancel-in-progress: false

jobs:
  v4_story_editor:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      copilot-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Copilot CLI (one inference)
        run: npm install -g @github/copilot
      - name: Blind review from script scenes and original brief only
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -m scripts.agent_war_v4_review --out out/v4_story_editor.json
      - name: Verify receipt and archive raw session, no film promotion
        env:
          TARGET: audits/agent_war_single_reviews/${{ github.run_id }}
          REPO_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p "$TARGET"
          cp out/v4_story_editor.json out/v4_story_editor.jsonl "$TARGET/"
          python3 - <<'PY'
          import os
          from pathlib import Path
          from scripts.agent_war_v4_review import verify
          path = Path(os.environ["TARGET"]) / "v4_story_editor.json"
          obj = verify(path)
          assert obj["provenance"]["artistic_acceptance"] is False
          assert obj["provenance"]["external_human_viewer_count"] == 0
          (path.parent / "README.md").write_text(
              "# V4 separately executed AI Story Editor\n\n"
              "One real Copilot inference, script-only independent of author framing. "
              "Not human feedback, not story approval, no automatic production.\n",
              encoding="utf-8",
          )
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$TARGET"
          git commit -m 'agent-story: archive separately executed v4 story editor [skip ci]'
          for attempt in 1 2 3 4; do
            git fetch origin "refs/heads/$REPO_REF"
            git rebase FETCH_HEAD
            if git push origin "HEAD:refs/heads/$REPO_REF"; then exit 0; fi
          done
          exit 1
