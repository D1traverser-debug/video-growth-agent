name: Agent War - V8 Rebuild Against Independent Critique

on:
  push:
    branches:
      - refactor/prompt-director-core-20261023
    paths:
      - .github/workflows/agent-war-v8-followup.yml
      - scripts/agent_war_v8_followup.py
  workflow_dispatch:

concurrency:
  group: agent-war-v8-followup-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rewrite_v8:
    name: Rebuild full story from real V7 and real critique
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      copilot-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install verified Copilot CLI
        run: npm install -g @github/copilot
      - name: Execute V8 writer from evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 -m scripts.agent_war_v8_followup \
            --stage rewrite_v8 \
            --output out/revision-v8-candidate.json
      - uses: actions/upload-artifact@v4
        with:
          name: agent-war-v8-draft
          path: |
            out/revision-v8-candidate.json
            out/revision-v8-candidate.jsonl
          if-no-files-found: error
          retention-days: 30

  review_v8:
    name: Separate-model V8 story critique
    needs: rewrite_v8
    runs-on: ubuntu-latest
    timeout-minutes: 14
    permissions:
      contents: read
      copilot-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: agent-war-v8-draft
          path: evidence
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install verified Copilot CLI
        run: npm install -g @github/copilot
      - name: Blind review full revised V8 only
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 -m scripts.agent_war_v8_followup \
            --stage review_v8 \
            --previous evidence/revision-v8-candidate.json \
            --output out/review-v8_story_editor.json
      - uses: actions/upload-artifact@v4
        with:
          name: agent-war-v8-critique
          path: |
            out/review-v8_story_editor.json
            out/review-v8_story_editor.jsonl
          if-no-files-found: error
          retention-days: 30

  preserve:
    name: Save real V8 output and contrary review without approving it
    needs: [rewrite_v8, review_v8]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: agent-war-v8-*
          path: evidence
          merge-multiple: true
      - name: Verify two different model sessions and archive evidence
        env:
          TARGET: audits/agent_war_ai_review_runs/${{ github.run_id }}
          REPO_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p "$TARGET"
          cp evidence/revision-v8-candidate.json "$TARGET/"
          cp evidence/revision-v8-candidate.jsonl "$TARGET/"
          cp evidence/review-v8_story_editor.json "$TARGET/"
          cp evidence/review-v8_story_editor.jsonl "$TARGET/"
          python3 - <<'PY'
          import json, os, hashlib
          from pathlib import Path
          base = Path(os.environ["TARGET"])
          w = json.loads((base / "revision-v8-candidate.json").read_text(encoding="utf-8"))
          e = json.loads((base / "review-v8_story_editor.json").read_text(encoding="utf-8"))
          for doc in (w,e):
              proof = doc["provenance"]
              assert proof["github_run_id"] == os.environ["GITHUB_RUN_ID"]
              assert proof["provider"] == "github-copilot-cli"
              assert proof["provider_response_id"] and proof["copilot_session_id"]
              assert hashlib.sha256(doc["model_output"].encode("utf-8")).hexdigest() == proof["output_sha256"]
          assert w["provenance"]["github_job"] != e["provenance"]["github_job"]
          assert w["provenance"]["copilot_session_id"] != e["provenance"]["copilot_session_id"]
          (base/"V8_CANDIDATE_UNAPPROVED.md").write_text(
              "# Agent 战争 V8 候选：未由真人或观众确认\n\n" + w["model_output"] + "\n",
              encoding="utf-8",
          )
          (base/"V8_INDEPENDENT_AI_CRITIQUE.md").write_text(
              "# 独立 Copilot 会话对 V8 的审稿意见（不是观众验收）\n\n" + e["model_output"] + "\n",
              encoding="utf-8",
          )
          (base/"README.md").write_text(
              "# Evidence-linked V8 story-room iteration\n\n"
              "Source: run 40070247446 V7 + independent reviewer. "
              "The writer and V8 critic used separate real GitHub Copilot model sessions.\n\n"
              f"Writer session: {w['provenance']['copilot_session_id']}\n"
              f"Reviewer session: {e['provenance']['copilot_session_id']}\n"
              "Creative review may require further rewrites; no storyreel or real viewers.\n",
              encoding="utf-8",
          )
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$TARGET"
          git commit -m "agent-story: archive independent V8 draft and critique [skip ci]"
          git push origin "HEAD:refs/heads/$REPO_REF"
