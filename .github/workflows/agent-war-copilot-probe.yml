name: Agent War - Copilot entitlement probe

on:
  push:
    branches:
      - refactor/prompt-director-core-20261023
    paths:
      - .github/workflows/agent-war-copilot-probe.yml
  workflow_dispatch:

jobs:
  copilot-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    permissions:
      contents: read
      copilot-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install currently supported Copilot CLI
        run: npm install -g @github/copilot
      - name: Call actual model without allowing repo tools
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COPILOT_HOME: ${{ runner.temp }}/copilot-agent-war-probe
        shell: bash
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}"
          copilot --version
          copilot -p "Return only this exact Chinese string as your reply: AGENT_WAR_MODEL_READY" \
            --no-ask-user --no-custom-instructions --output-format json > "${RUNNER_TEMP}/copilot-probe-events.jsonl"
          python - <<'PY'
          from pathlib import Path
          import os, json
          rows = [json.loads(x) for x in Path(os.environ["RUNNER_TEMP"], "copilot-probe-events.jsonl").read_text(encoding="utf-8").splitlines() if x.strip()]
          print("copilot_event_types=", [x.get("type") for x in rows])
          for event in rows:
              if event.get("type") in ("result", "model.call_final_result", "assistant.message", "model.call_finished"):
                  data = event.get("data")
                  print("event_shape=", event.get("type"), sorted(event.keys()), sorted(data.keys()) if isinstance(data, dict) else type(data).__name__)
                  if event.get("type") == "result":
                      print("result_meta=", {k: v for k,v in event.items() if k not in ("data", "content", "text")})
                      if isinstance(data, dict):
                          print("result_identity=", {k: v for k,v in data.items() if k in ("sessionId", "session_id", "sessionID", "id", "model", "modelName", "duration_ms", "exitCode")})

          for item in rows:
              if item.get("type") in ("session.start", "session_start", "session.complete", "session_complete"):
                  data = item.get("data") or {}
                  print("copilot_session_evidence=", {k: data[k] for k in ("sessionId", "session_id", "id", "selectedModel", "reason") if k in data})
          message_text = "".join(str(x.get("data", {}).get("content", x.get("text", ""))) for x in rows if x.get("type") in ("assistant.message", "agent_message_chunk"))
          print("copilot_inference_valid=", "AGENT_WAR_MODEL_READY" in message_text)
          if "AGENT_WAR_MODEL_READY" not in message_text:
              raise SystemExit("Copilot CLI did not report valid structured inference")
          PY
