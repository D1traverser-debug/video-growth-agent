name: Agent War - Isolated Story Room

on:
  push:
    branches:
      - refactor/prompt-director-core-20261023
    paths:
      - .github/workflows/agent-war-story-room.yml
      - scripts/agent_war_review_runner.py
      - scripts/agent_war_copilot_runner.py
      - projects/ai-self-media-commercialization/creative_candidates/agent_war/DUANMIAN_SCREENPLAY_V6_2026-10-24.md
  workflow_dispatch:

concurrency:
  group: agent-war-story-room-${{ github.ref }}
  cancel-in-progress: false

jobs:
  premise_challenger:
    name: Independent premise challenger (brief only)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      copilot-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Copilot CLI
        run: npm install -g @github/copilot
      - name: Run isolated alternative-writer model
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        run: |
          python3 -m scripts.agent_war_copilot_runner \
            --stage premise_challenger \
            --output out/review-premise_challenger.json
      - uses: actions/upload-artifact@v4
        with:
          name: story-review-premise
          path: |
            out/review-premise_challenger.json
            out/review-premise_challenger.jsonl
          if-no-files-found: error
          retention-days: 30

  story_editor:
    name: Independent story editor (clean V6 only)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      copilot-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Copilot CLI
        run: npm install -g @github/copilot
      - name: Run isolated V6 story-editor model
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        run: |
          python3 -m scripts.agent_war_copilot_runner \
            --stage story_editor \
            --output out/review-story_editor.json
      - uses: actions/upload-artifact@v4
        with:
          name: story-review-editor
          path: |
            out/review-story_editor.json
            out/review-story_editor.jsonl
          if-no-files-found: error
          retention-days: 30

  rewrite:
    name: Rewrite candidate after both reviews
    needs: [premise_challenger, story_editor]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      copilot-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: story-review-*
          path: reviews
          merge-multiple: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Copilot CLI
        run: npm install -g @github/copilot
      - name: Require two real same-run reviews and draft V7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        run: |
          python3 -m scripts.agent_war_copilot_runner \
            --stage rewrite \
            --review-dir reviews \
            --output out/revision-v7-candidate.json
      - uses: actions/upload-artifact@v4
        with:
          name: story-revision-candidate
          path: |
            out/revision-v7-candidate.json
            out/revision-v7-candidate.jsonl
          if-no-files-found: error
          retention-days: 30

  preserve:
    name: Preserve raw external outputs on Draft PR branch
    needs: [premise_challenger, story_editor, rewrite]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/download-artifact@v4
        with:
          pattern: story-*
          path: reviews
          merge-multiple: true
      - name: Save only receipts and unapproved creative candidates
        env:
          TARGET: audits/agent_war_ai_review_runs/${{ github.run_id }}
          REPO_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p "$TARGET"
          cp reviews/review-premise_challenger.json "$TARGET/"
          cp reviews/review-premise_challenger.jsonl "$TARGET/"
          cp reviews/review-story_editor.json "$TARGET/"
          cp reviews/review-story_editor.jsonl "$TARGET/"
          cp reviews/revision-v7-candidate.json "$TARGET/"
          cp reviews/revision-v7-candidate.jsonl "$TARGET/"
          python3 - <<'PY'
          import json
          from pathlib import Path
          import os
          base = Path(os.environ["TARGET"])
          a = json.loads((base / "review-premise_challenger.json").read_text(encoding="utf-8"))
          e = json.loads((base / "review-story_editor.json").read_text(encoding="utf-8"))
          v = json.loads((base / "revision-v7-candidate.json").read_text(encoding="utf-8"))
          for obj in (a, e, v):
              assert obj["provenance"]["github_run_id"] == os.environ["GITHUB_RUN_ID"]
              assert obj["provenance"]["provider_response_id"]
          assert a["provenance"]["github_job"] != e["provenance"]["github_job"]
          assert a["provenance"]["provider_response_id"] != e["provenance"]["provider_response_id"]
          (base / "V7_CANDIDATE_UNAPPROVED.md").write_text(
              "# Agent × 战争：隔离审稿后改稿候选（非审稿通过）\n\n" + v["model_output"] + "\n",
              encoding="utf-8",
          )
          readme = (
              "# Agent War isolated model story-room execution\n\n"
              "Two separately executed GitHub Actions inference jobs reviewed clean, disjoint inputs. "
              "They are **AI model reviews, NOT human experts or viewer screenings**. "
              "Third model execution produced an unapproved revised candidate.\n\n"
              f"- Original GitHub Actions run: {os.environ['GITHUB_RUN_ID']}\n"
              f"- Original script commit: {os.environ['GITHUB_SHA']}\n"
              f"- Independent reviewer response IDs: {a['provenance']['provider_response_id']} "
              f"and {e['provenance']['provider_response_id']}\n"
              f"- Revision response ID: {v['provenance']['provider_response_id']}\n"
              "- No real audience test, video generation, or screenplay artistic approval occurred.\n"
              "- Raw responses and SHA-256-bound metadata are in JSON files here.\n"
          )
          (base / "README.md").write_text(readme, encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$TARGET"
          git commit -m "agent-story: preserve isolated V6 outsider critiques and V7 candidate [skip ci]"
          git push origin "HEAD:refs/heads/$REPO_REF"
